# fly.toml app configuration file generated for server-bold-waterfall-8280 on 2026-10-15T12:32:16+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'server-bold-waterfall-8280'
primary_region = 'fra'

[build]
[env]
  DB = 'Data Source=/data/db.db'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
